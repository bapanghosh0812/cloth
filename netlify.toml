[build]
  # Install the API's packages (for the function below), then build the storefront.
  command = "npm --prefix server ci --omit=dev && npm run build"
  publish = "dist"

# The Express API runs as a Netlify Function (server/functions/api.js).
# It needs MONGODB_URI and JWT_SECRET in Site configuration → Environment variables.
[functions]
  directory = "server/functions"
  node_bundler = "esbuild"

# Same-address API: the storefront calls /api/..., Netlify hands it to the function.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Vite fingerprints everything in /assets, so browsers can cache it forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/collection/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
