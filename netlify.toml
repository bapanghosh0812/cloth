[build]
  command = "npm run build"
  publish = "dist"

# Vite fingerprints everything in /assets, so browsers can cache it forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/collection/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
